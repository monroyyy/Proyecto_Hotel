# ========================================
# CONFIGURACION DEL SERVIDOR E IMPORTACION DE .ENV
# ========================================
spring.application.name=hotel
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties]

# ========================================
# CONEXION A LA BASE DE DATOS
# ========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Jobs programados desactivados por defecto (poner true solo cuando se habilite el scheduler automático)
app.jobs.expiracion-enabled=${APP_JOBS_EXPIRACION_ENABLED:false}
# Modo solo simulación/log del job de expiración y No-Show (true por defecto para evitar cambios automáticos sin verificación)
app.jobs.expiracion-dry-run=${APP_JOBS_EXPIRACION_DRY_RUN:true}

# Seed inicial migrado a Flyway (R__seed_catalogo_inicial.sql) para que no corra antes ni difiera Flyway tras JPA
spring.sql.init.mode=never

# ==============================================================================
# SEGURIDAD JWT Y AUTENTICACION
# ==============================================================================
app.jwt.secret=${JWT_SECRET:ClaveSecretaDesarrolloLocalMinimo32BytesParaHotelParaiso2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.verification.expiration-minutes=${VERIFICATION_TOKEN_EXPIRATION_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Confianza en cabeceras X-Forwarded-For (false por defecto: usa request.getRemoteAddr())
app.security.trust-forwarded-headers=${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}
app.security.trusted-proxies=${APP_SECURITY_TRUSTED_PROXIES:}

# Administrador inicial (seeder seguro por configuracion)
app.admin.initial-name=${ADMIN_INITIAL_NAME:Administrador Hotel Paraiso}
app.admin.initial-email=${ADMIN_INITIAL_EMAIL:admin@hotelparaiso.com}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin1234!}

# ==============================================================================
# CONFIGURACION SMTP (GMAIL CON CONTRASENA DE APLICACION)
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# CONFIGURACION SPRING AI (GEMINI)
# ==============================================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:placeholder-configure-in-env}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.4
spring.ai.google.genai.chat.top-p=0.85
spring.ai.google.genai.chat.max-output-tokens=2048

# ==============================================================================
# CONFIGURACION SPRING AI (OLLAMA LOCAL)
# ==============================================================================
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=gemma4:31b-cloud
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.top-p=0.85
spring.ai.ollama.chat.options.num-predict=2048
spring.ai.ollama.chat.options.num-ctx=8192

# ==============================================================================
# PERSISTENCIA DE MEMORIA CONVERSACIONAL (SPRING AI JDBC)
# ==============================================================================
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

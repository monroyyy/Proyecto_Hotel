# ========================================
# CONFIGURACION DEL SERVIDOR
# ========================================
spring.application.name=hotel
server.port=8080

# ========================================
# CONEXION A LA BASE DE DATOS
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Para que data.sql se ejecute en MySQL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

